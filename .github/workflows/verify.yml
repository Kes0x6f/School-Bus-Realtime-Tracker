name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check public PHP allow-list
        run: bash scripts/check-public-php.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: xdebug

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Prepare SQLite application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Verify migration lifecycle
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run PHP tests
        run: |
          mkdir -p storage/test-results
          php artisan config:clear --ansi
          php artisan test \
            --log-junit storage/test-results/phpunit.xml \
            --coverage-clover storage/test-results/coverage.xml

      - name: Publish PHP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-test-results
          path: storage/test-results/
          if-no-files-found: warn

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build frontend assets
        run: npm run build

  mysql-shift-lifecycle:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Verify MySQL migration lifecycle
        run: |
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Verify shift lifecycle on MySQL
        run: php artisan test tests/Feature/ShiftCompletionTest.php
